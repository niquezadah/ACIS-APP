
# Microservicio ACIS
spring.application.name=acis-microservicio

# Puerto de la API REST
server.port=8080
server.address=127.0.0.1
spring.sql.init.mode=always

# Base de datos H2 local
spring.datasource.url=${ACIS_DB_URL:jdbc:h2:file:./data/acis-db;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${ACIS_DB_DRIVER:org.h2.Driver}
spring.datasource.username=${ACIS_DB_USERNAME:sa}
spring.datasource.password=${ACIS_DB_PASSWORD:}

# Persistencia mediante JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Configuracion de Hibernate
spring.jpa.show-sql=false

# Las rutas privadas de fotos no forman parte del contrato de la API.
spring.jackson.deserialization.fail-on-unknown-properties=true
